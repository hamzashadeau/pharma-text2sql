[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-text2sql"
version = "0.1.0"
description = "Natural-language questions over a pharmaceutical sales table, with guardrails and a measured evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hamza Bouigrouane" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlglot>=25.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
pharma-text2sql = "pharma_text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: tests that deliberately wait for a timeout"]
filterwarnings = ["ignore::DeprecationWarning"]
