name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the dataset
        run: python data/generate.py

      - name: Tests
        run: pytest -q

      # The evaluation runs on every push, with no API key: the deterministic
      # planner answers, so the suite costs nothing and a regression in the
      # guard, the resolver or the planner fails the build instead of being
      # noticed in production.
      - name: Evaluation suite
        run: python eval/run_eval.py --min-accuracy 0.95 --json eval-report.json --save-run run.json

      # Compares this run against the committed baseline and fails on any
      # question that got worse — including questions with no ground truth,
      # where a status or faithfulness drop is the only signal available.
      - name: Regression against the baseline
        run: python eval/run_eval.py --compare eval/baseline.json --fail-on-regression

      # Baselines only: Holt-Winters fits a grid per origin, which is minutes
      # on a full portfolio and buys nothing here. What CI must catch is the
      # harness breaking, not the model's score moving.
      - name: Forecast backtest
        run: python -m pharma_text2sql.forecast --level molecule --max-series 5 --fast

      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: eval-report.json
